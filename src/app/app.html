<!-- Structural Layer 1: Introductory Header Content -->
<header>
  <img src="../assets/qnopy-logo.jpg" alt="Qnopy Logo" />
  <h1>Let's get started</h1>
  <p>First time exploring Angular</p>
  <app-header></app-header>
  <!-- NOTE: Only keep <app-header> here if this file is NOT the header component itself -->
</header>

<!-- Structural Layer 2: Main Content Component Layer -->
<main>
  <ul id="users">
    <li>
      <app-user [id] = "users[0].id" 
                [avatar]="users[0].avatar" 
                [name] ="users[0].name" 
                (select) = outputId($event)>
      </app-user>
    </li>
 
    <li>
       <app-user [id] = "users[1].id" [avatar]="users[1].avatar" [name] = "users[1].name" (select) = "outputId($event)"></app-user>
    </li>
    <li>
       <app-user [id] ="users[2].id" [avatar]="users[2].avatar" [name] = "users[2].name" (select) = "outputId($event)"></app-user>
    </li>
  </ul>
</main>
